<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#0f1a1f"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59E0B" stop-opacity=".35"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif; }
      .mono { font-family: 'JetBrains Mono',Consolas,monospace; }
      .draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 2.2s ease-out forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .fade { opacity: 0; animation: in .8s ease-out forwards; }
      .d1 { animation-delay: .2s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: 1s; }
      @keyframes in { to { opacity: 1; } }
    </style>
  </defs>

  <rect width="900" height="220" rx="16" fill="url(#bg)"/>
  <g stroke="#1f2a30" stroke-width="1">
    <line x1="0" y1="55" x2="900" y2="55"/><line x1="0" y1="110" x2="900" y2="110"/><line x1="0" y1="165" x2="900" y2="165"/>
  </g>

  <!-- curva de producción creciente -->
  <path d="M0 212 L60 210 L120 208 L180 209 L240 206 L300 204 L360 202 L420 198 L480 190 L540 180 L600 160 L660 140 L720 115 L780 90 L840 65 L900 40 L900 220 L0 220 Z" fill="url(#area)" class="fade d1"/>
  <path d="M0 212 L60 210 L120 208 L180 209 L240 206 L300 204 L360 202 L420 198 L480 190 L540 180 L600 160 L660 140 L720 115 L780 90 L840 65 L900 40" fill="none" stroke="#F59E0B" stroke-width="3" class="draw"/>
  <!-- barras -->
  <g fill="#38BDF8" opacity=".25">
    <rect x="610" y="150" width="22" height="70"/><rect x="650" y="138" width="22" height="82"/><rect x="690" y="120" width="22" height="100"/>
    <rect x="730" y="104" width="22" height="116"/><rect x="770" y="88" width="22" height="132"/><rect x="810" y="72" width="22" height="148"/>
  </g>

  <g class="fade d1"><text x="48" y="60" class="mono" font-size="14" fill="#38BDF8">df.groupby("energía").analizar()</text></g>
  <g class="fade d2"><text x="48" y="110" class="sans" font-size="42" font-weight="700" fill="#F3F4F6">Jesús Alberto Chávez</text></g>
  <g class="fade d3">
    <text x="48" y="146" class="sans" font-size="18" fill="#C9D1D9">Análisis de datos para el sector energético</text>
    <text x="48" y="174" class="sans" font-size="15" fill="#8B949E">Docente de Informática · Compresión de gas · Python &amp; Pandas</text>
  </g>
</svg>
